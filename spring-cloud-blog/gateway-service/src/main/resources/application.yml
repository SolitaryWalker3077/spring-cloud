server:
  port: 10030

spring:
  application:
    name: gateway-service
  cloud:
    nacos:
      discovery:
        server-addr: 43.140.242.83:8848
    gateway:
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/user/**
        - id: blog-service
          uri: lb://blog-service
          predicates:
            - Path=/blog/**
      # 网关全局跨域配置
      globalcors:
        # 解决options请求被拦截的问题
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true

---
#开发环境
spring:
  config:
    activate:
      on-profile: dev
nacos:
  address: 43.140.242.83:8848

---
#生产环境
spring:
  config:
    activate:
      on-profile: prod
nacos:
  address: 127.0.0.1:8848