server:
  port: 10030

spring:
  application:
    name: gateway
  cloud:
    nacos:
      discovery:
        server-addr: 43.140.242.83:8848
    gateway:
      routes: # ⽹关路由配置
        - id: order-service #路由ID, ⾃定义, 唯⼀即可
          uri: lb://order-service/ #⽬标服务地址
          predicates: #路由条件
            - Path=/order/** , /feign/**
        - id: product-service
          uri: lb://product-service/
          predicates:
            - Path=/product/**